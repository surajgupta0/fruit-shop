name: fruit-shop

networks:
  fruit-shop:
    name: fruit-shop

services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: fruit-shop-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env.dev
    volumes:
      # Local CA only — not in git; keep services/api/certs/aiven-ca.pem on your machine
      - ../services/api/certs:/app/certs:ro
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-verify-ca}
      DB_SSL_CA: ${DB_SSL_CA:-/app/certs/aiven-ca.pem}
      DATABASE_URL: ${DATABASE_URL:-}
    networks:
      - fruit-shop
    restart: unless-stopped
