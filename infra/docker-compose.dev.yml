name: fruit-shop

networks:
  fruit-shop:
    name: fruit-shop

services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: fruit-shop-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env.dev
    volumes:
      # Live-reload: edits to services/api/app on the host restart uvicorn
      - ../services/api/app:/app/app
      - ../services/api/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - fruit-shop
    restart: unless-stopped
