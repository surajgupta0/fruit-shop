name: fruit-shop

networks:
  fruit-shop:
    name: fruit-shop

services:
  traefik:
    image: traefik:v3.3
    container_name: fruit-shop-traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - fruit-shop
    restart: unless-stopped

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: fruit-shop-auth-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      MOCK_MODE: ${AUTH_SERVICE_MOCK_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      DATABASE_URL: ${AUTH_SERVICE_DATABASE_URL}
      REDIS_URL: ${AUTH_SERVICE_REDIS_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8000}
    labels:
      - traefik.enable=true
      - traefik.docker.network=fruit-shop
      - traefik.http.routers.auth-service.rule=PathPrefix(`/api/auth-service`)
      - traefik.http.routers.auth-service.entrypoints=web
      - traefik.http.routers.auth-service.middlewares=auth-service-strip
      - traefik.http.middlewares.auth-service-strip.stripprefix.prefixes=/api/auth-service
      - traefik.http.services.auth-service.loadbalancer.server.port=8000
    networks:
      - fruit-shop
    restart: unless-stopped

  catalog-service:
    build:
      context: ../services/catalog-service
      dockerfile: Dockerfile
    container_name: fruit-shop-catalog-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: ${CATALOG_SERVICE_DATABASE_URL}
      REDIS_URL: ${CATALOG_SERVICE_REDIS_URL}
    labels:
      - traefik.enable=true
      - traefik.docker.network=fruit-shop
